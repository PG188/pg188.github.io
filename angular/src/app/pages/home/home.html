<main>
  <h1>Prakhar Garg</h1>
  <p>Welcome to my portfolio. Here are some projects I’ve worked on.</p>

  <section aria-labelledby="projects-heading">
    <h2 id="projects-heading">Projects</h2>

    @for (project of projects; track project.title) {
      <article>
        @if (project.route) {
          <h3><a [routerLink]="project.route">{{ project.title }}</a></h3>
        } @else {
          <h3>{{ project.title }}</h3>
        }
      </article>
    }
  </section>
</main>
