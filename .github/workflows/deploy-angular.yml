name: Deploy Angular site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: angular

      - name: Run tests
        run: npm test -- --watch=false
        working-directory: angular

      - name: Build Angular site
        run: npm run build
        working-directory: angular

      - name: Prepare GitHub Pages files
        run: |
          cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html
        working-directory: angular

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: angular/dist/portfolio/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
